[project]
name = "lerobot_teleoperator_openarm_ker"
version = "0.1.1"
description = "LeRobot teleoperator for the OpenArm KER leader arm"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Lakshya Singh Panwar", email = "11391474+iAmLakshya@users.noreply.github.com" }]
requires-python = ">=3.12"
keywords = ["lerobot", "openarm", "ker", "teleoperation", "robotics"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "lerobot>=0.6.1,<0.7.0",
    "openarm-ker>=0.3.0,<0.4.0",
]

[project.urls]
Homepage = "https://github.com/iAmLakshya/lerobot_teleoperator_openarm_ker"
Issues = "https://github.com/iAmLakshya/lerobot_teleoperator_openarm_ker/issues"

[dependency-groups]
dev = [
    "mypy>=1.18",
    "pytest>=8.0",
    "ruff>=0.14.1",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lerobot_teleoperator_openarm_ker"]

[tool.hatch.build.targets.sdist]
include = ["lerobot_teleoperator_openarm_ker", "tests", "README.md", "LICENSE"]

# The lint rules follow LeRobot (pyproject.toml of huggingface/lerobot), so the code can move in-tree.
[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "T20", "N", "UP", "SIM", "D"]
ignore = ["E501", "T201", "T203", "B008", "D107"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "F403", "E402", "D104"]
"tests/**" = ["D"]

[tool.ruff.lint.isort]
combine-as-imports = true
known-first-party = ["lerobot_teleoperator_openarm_ker"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.12"
files = ["lerobot_teleoperator_openarm_ker"]
ignore_missing_imports = true
follow_imports = "skip"
implicit_reexport = false
warn_unused_ignores = true
strict_equality = true

[tool.pytest.ini_options]
testpaths = ["tests"]
